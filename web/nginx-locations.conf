# Shared by the HTTP server (nginx.conf) and the opt-in HTTPS server
# (docker-entrypoint-tailscale-https.sh) so both proxy the same routes.

# Security headers on every response, proxied ones included (none of the
# locations below sets its own add_header, so these are inherited).
# Relative redirects keep a public HTTPS visitor on HTTPS (nginx would
# otherwise build http:// Locations from what it sees behind the proxy).
absolute_redirect off;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $pwa_hsts always;
limit_conn pwa_conn 60;

# The state poll can run into megabytes (the item/monster catalog) and JSON
# compresses well. gzip_proxied any is needed because nginx doesn't gzip
# proxied responses by default.
gzip on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types application/json text/plain text/css application/javascript text/event-stream;

# SPA fallback: any path that isn't a static file serves index.html.
location / {
    try_files $uri $uri/ /index.html;
}

# /party-api/dashboard-stream is Server-Sent Events, which nginx's default
# buffering would hold back. Buffering is off for the whole prefix rather
# than special-casing that one route.
location /party-api/ {
    limit_req zone=pwa_api burst=120 nodelay;
    proxy_pass http://party-console:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

# /setup/state and /setup/pair (the pairing check) are console paths. If
# they fell through to the SPA fallback, an unpaired browser would get a 200
# and look paired, then open the dashboard stream, which redirects to
# /setup, which returns index.html again. EventSource reconnects with
# little backoff, so that loop can produce thousands of requests a minute.
location /setup/ {
    limit_req zone=pwa_auth burst=20 nodelay;
    proxy_pass http://party-console:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
}

# The console's update service (GET /console-update, POST
# /console-update/<action>) lives at the host root, not under /party-api/.
location /console-update {
    limit_req zone=pwa_api burst=120 nodelay;
    proxy_pass http://party-console:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
}

# Debug instance controls (/console-debug) and, on a debug instance, its
# game viewer (/debug-game, websockify over a WebSocket) and local game
# images (/debug-assets). All are host-root paths.
location /console-debug {
    limit_req zone=pwa_api burst=120 nodelay;
    proxy_pass http://party-console:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
}
location /debug-assets/ {
    limit_req zone=pwa_api burst=120 nodelay;
    proxy_pass http://party-console:3010;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
}
location /debug-game/ {
    limit_req zone=pwa_api burst=120 nodelay;
    proxy_pass http://party-console:3010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_read_timeout 1h;
}

# Push notifier (notifier/server.mjs) running inside this container.
location /notify/ {
    limit_req zone=pwa_auth burst=20 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:3090;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $http_host;
}
