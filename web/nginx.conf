# Serves the built PWA and proxies /party-api/* to the party-console
# coordinator on the SAME origin this file itself serves - the whole
# point being that the browser never makes a cross-origin request at all
# (party-console's coordinator sends no Access-Control-Allow-Origin
# header, so any cross-origin request to it is blocked by the browser's
# own CORS enforcement - confirmed against a live server).
#
# "party-console:3010" below is the service name/port from party-
# console's own compose.yaml (services.party-console, container port
# 3010) - if you renamed that service in your own compose file, change
# it here to match (this is a literal Docker Compose DNS name, resolved
# once at nginx startup via Docker's embedded DNS - no extra config
# needed for that part to work).
#
# proxy_set_header Host $http_host below is NOT optional - party-console
# rejects every mutating command (upgrade-mark, clear-item-marks, ...)
# with 403 "Game origin required" / 400 "invalid command" without it.
# Its own CORS check (tools/hosting/request-origin.ts) computes "what
# origin did this request come from" purely from the Host header IT
# receives - nginx's default (no proxy_set_header Host at all) sends the
# upstream's own address ($proxy_host, i.e. "party-console:3010") instead
# of the browser's real Host, so that check can never match the browser's
# actual Origin header. $http_host (not $host) specifically, because
# $host strips the port and the browser's Origin header does not -
# confirmed against a live server this session: every upgrade-mark call
# silently 400'd until this was added.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dynamic-state poll can run into the megabytes (the full item/
    # monster catalog especially) - on a slow phone connection or a
    # filtered guest wifi, sending that uncompressed is a real chunk of
    # the perceived lag. JSON compresses extremely well (usually 80%+),
    # so this alone is a meaningful win with zero application risk.
    # gzip_proxied any is required for /party-api/ specifically: nginx
    # doesn't gzip a proxied response by default even on the same host.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types application/json text/plain text/css application/javascript;

    # The SPA itself - client-side routing (react-router) means any path
    # that isn't a real static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /party-api/dashboard-stream is a long-lived Server-Sent-Events
    # response - nginx buffers proxied responses by default, which would
    # hold every SSE message until the buffer fills instead of delivering
    # them as they arrive. Disabling buffering (and caching, redundant
    # but explicit) for the whole /party-api/ prefix keeps this simple
    # rather than special-casing just the one route.
    location /party-api/ {
        proxy_pass http://party-console:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # /setup/state and /setup/pair (the browser-pairing check the app's own
    # PairingGate calls) are party-console API paths too, not app routes -
    # without this block they fall through to the SPA fallback above, which
    # returns 200 index.html for ANY path. That made an unpaired session look
    # "paired" (a 200 is a 200), which then let the app mount its dashboard
    # SSE connection - which party-console redirects to /setup for the exact
    # same missing-pairing reason, itself unproxied, so it 200'd right back
    # to index.html too. Browsers auto-reconnect a broken EventSource with no
    # real backoff, so that one wiring gap alone produced tens of thousands
    # of requests in minutes during testing - not a cosmetic bug.
    location /setup/ {
        proxy_pass http://party-console:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
    }
}
