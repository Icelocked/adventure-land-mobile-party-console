# Serves the built PWA and proxies the party-console API on the same
# origin. The console sends no Access-Control-Allow-Origin header, so the
# browser must never make a cross-origin request to it.
#
# "party-console:3010" is the service name and port from party-console's
# compose.yaml, resolved through Docker's embedded DNS. If you renamed that
# service, change it here too.
#
# proxy_set_header Host $http_host is required: the console derives the
# request origin from the Host header it receives and rejects mutating
# commands (403 "Game origin required" / 400 "invalid command") when that
# doesn't match the browser's Origin. nginx's default sends the upstream
# address instead, and $host would drop the port that Origin keeps.


# Exposure hardening (http level; conf.d files are included in the http
# block). The PWA can be reachable from the public internet through Tailscale
# Funnel, so it limits request rates per client and hides its version.
server_tokens off;

# Funnel and Serve reach nginx through Tailscale's proxy and Docker's port
# publishing, so the visible peer is a local or Docker-bridge address. Take
# the real client from X-Forwarded-For only when the peer is one of those.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-client limits. The app itself polls a few requests a second (more
# while a live stream is down) and holds a handful of event streams; the
# pairing and notifier endpoints need far less.
limit_req_zone $binary_remote_addr zone=pwa_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pwa_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=pwa_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# HSTS only for requests that arrived over HTTPS (this container's own TLS
# server, or Tailscale's HTTPS front end, which sets X-Forwarded-Proto).
map "$scheme:$http_x_forwarded_proto" $pwa_hsts {
    default "";
    "~https" "max-age=31536000";
}

# WebSocket upgrade for /debug-game.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/pwa-locations.conf;
}
