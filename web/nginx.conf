# Serves the built PWA and proxies /party-api/* to the party-console
# coordinator on the SAME origin this file itself serves - the whole
# point being that the browser never makes a cross-origin request at all
# (party-console's coordinator sends no Access-Control-Allow-Origin
# header, so any cross-origin request to it is blocked by the browser's
# own CORS enforcement - confirmed against a live server).
#
# "party-console:3010" below is the service name/port from party-
# console's own compose.yaml (services.party-console, container port
# 3010) - if you renamed that service in your own compose file, change
# it here to match (this is a literal Docker Compose DNS name, resolved
# once at nginx startup via Docker's embedded DNS - no extra config
# needed for that part to work).
#
# proxy_set_header Host $http_host below is NOT optional - party-console
# rejects every mutating command (upgrade-mark, clear-item-marks, ...)
# with 403 "Game origin required" / 400 "invalid command" without it.
# Its own CORS check (tools/hosting/request-origin.ts) computes "what
# origin did this request come from" purely from the Host header IT
# receives - nginx's default (no proxy_set_header Host at all) sends the
# upstream's own address ($proxy_host, i.e. "party-console:3010") instead
# of the browser's real Host, so that check can never match the browser's
# actual Origin header. $http_host (not $host) specifically, because
# $host strips the port and the browser's Origin header does not -
# confirmed against a live server this session: every upgrade-mark call
# silently 400'd until this was added.


# WebSocket upgrade for /debug-game (conf.d files are included in the http block).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/pwa-locations.conf;
}
