name: Release

# Pushing a tag like "v0.2.0" builds the signed APK, the PWA image and the
# PWA install packages, and attaches them to a new GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (see ci.yml).
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Signed with the project's permanent release key (repository
      # secrets), so each release installs over the previous one. The
      # version comes from the tag: v1.2.3 -> versionName 1.2.3,
      # versionCode 10203.
      - name: Write release signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=companion"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Unit and UI tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PappVersion=${{ github.ref_name }} --stacktrace

      - name: Rename APK for the release asset
        run: cp app/build/outputs/apk/release/app-release.apk party-console-companion-${{ github.ref_name }}.apk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build PWA
        working-directory: web
        run: |
          npm ci
          npm run build

      # The no-Docker packages (Windows ZIP, Linux tarball) and the Docker
      # installers; see distribution/. The packages' updater finds its
      # package on the release by name and checks GitHub's asset digest.
      - name: Package PWA installs
        run: distribution/package.sh "${GITHUB_REF_NAME#v}" release-assets

      # The PWA image the in-app updater installs (web/updater/agent.mjs).
      # Pushed before the release exists, so the updater never sees a
      # release whose image is missing. Only stable tags move :latest.
      - name: Image version
        id: image
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tags=ghcr.io/icelocked/party-console-pwa:$version,ghcr.io/icelocked/party-console-pwa:latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/icelocked/party-console-pwa:$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PWA image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          build-args: PWA_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          push: true

      # The intro loads the icon from this tag, so it always matches the release.
      - name: Release notes intro
        run: sed "s/{{TAG}}/${GITHUB_REF_NAME}/g" .github/release-intro.md > "$RUNNER_TEMP/release-intro.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            party-console-companion-${{ github.ref_name }}.apk
            release-assets/*
          # The fixed "which one do I want?" intro, then the generated notes.
          body_path: ${{ runner.temp }}/release-intro.md
          generate_release_notes: true
          prerelease: ${{ steps.image.outputs.prerelease }}
