name: Release

# Pushing a tag like "v0.2.0" builds the signed APK and the PWA bundle and
# attaches both to a new GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (see ci.yml).
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Signed with the project's permanent release key (repository
      # secrets), so each release installs over the previous one. The
      # version comes from the tag: v1.2.3 -> versionName 1.2.3,
      # versionCode 10203.
      - name: Write release signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets are required"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=companion"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Unit and UI tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PappVersion=${{ github.ref_name }} --stacktrace

      - name: Rename APK for the release asset
        run: cp app/build/outputs/apk/release/app-release.apk party-console-companion-${{ github.ref_name }}.apk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Just the dist/ output; it still needs nginx.conf (or equivalent)
      # in front of it to proxy /party-api/.
      - name: Build PWA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Zip PWA build
        run: (cd web/dist && zip -r ../../party-console-companion-pwa-${{ github.ref_name }}.zip .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            party-console-companion-${{ github.ref_name }}.apk
            party-console-companion-pwa-${{ github.ref_name }}.zip
          generate_release_notes: true
