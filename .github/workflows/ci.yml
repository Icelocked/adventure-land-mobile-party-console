name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships a full Android SDK with licenses
      # pre-accepted (github.com/actions/runner-images) - the
      # android-actions/setup-android third-party action is unnecessary
      # and, in practice, less reliable than just using what's already
      # there. ANDROID_HOME is already set; the Gradle plugin auto-
      # downloads compileSdk 35 / build-tools 35.0.0 on first use.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
