name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK with licenses accepted and
      # ANDROID_HOME set, so no setup-android action is needed; Gradle
      # downloads compileSdk 35 / build-tools 35.0.0 on first use.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Robolectric unit and Compose UI tests.
      - name: Unit and UI tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
